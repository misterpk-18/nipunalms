# nginx site for the LMS (docs/DEVELOPMENT.md Part F). Install as /etc/nginx/sites-available/nipunalms, link it into
# sites-enabled, replace LMS_HOST, then `sudo nginx -t && sudo systemctl reload nginx` and `sudo certbot --nginx -d LMS_HOST`
# (certbot adds the 443 server and the HTTP -> HTTPS redirect). Keep `access_log ... masked` and the Referrer-Policy in
# every server block certbot writes.

# Activation and invite links carry a one-time token (`/activate?token=…`, checked by `/api/v1/auth/activation/<token>`):
# the access log shows it as [token], in the request line and in the Referer
map $request $masked_request {
    "~^(.*[?&]token=)[^&\s]+(.*)$"              "$1[token]$2";
    "~^(.*/auth/activation/)[^/?\s]+(.*)$"      "$1[token]$2";
    default                                     $request;
}
map $http_referer $masked_referer {
    "~^(.*[?&]token=)[^&]+(.*)$"                "$1[token]$2";
    default                                     $http_referer;
}
log_format masked '$remote_addr - $remote_user [$time_local] "$masked_request" $status $body_bytes_sent '
                  '"$masked_referer" "$http_user_agent"';

server {
    listen 80;
    server_name LMS_HOST;
    access_log /var/log/nginx/access.log masked;

    root /srv/nipunalms/frontend;
    index index.html;

    # Pages and their scripts never send their address (an activation link) as Referer
    add_header Referrer-Policy "no-referrer" always;

    # Content uploads go up to 250 MB for datasets / archives (app_settings.content_dataset_max_upload_mb); the API
    # applies the per-type limit itself
    client_max_body_size 260m;

    location /api/ {
        proxy_pass http://127.0.0.1:5060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The SPA: unknown paths fall back to index.html (deep links such as /academic/schedule)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "no-referrer" always;  # an add_header here replaces the server's, so repeat it
    }
}
